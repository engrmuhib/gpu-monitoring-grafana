      "title": "GPU Fleet Summary",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "tags": [
        "gpu",
        "summary",
        "management"
      ],
      "timezone": "browser",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "refresh": "1m",
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ],
        "hidden": false
      },
      "graphTooltip": 0,
      "links": [],
      "templating": {
        "list": []
      },
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Thanos",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "annotations": {
        "list": [
          {
            "builtIn": true,
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "type": "dashboard"
          },
          {
            "builtIn": true,
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "type": "dashboard"
          }
        ]
      },
      "panels": [
        {
          "id": 3,
          "title": "Total GPUs Installed",
          "description": "Counted by distinct UUID, so MIG instances on the same card aren't double counted.",
          "type": "stat",
          "pluginVersion": "13.0.1",
          "datasource": "${DS_PROMETHEUS}",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 5,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "text",
                "mode": "fixed"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "links": [
            {
              "targetBlank": false,
              "title": "See advertised vs physical, by node",
              "url": "/d/gpu-fleet-telemetry?viewPanel=22&${__all_variables}&from=${__from}&to=${__to}"
            }
          ],
          "targets": [
            {
              "expr": "count(count by (UUID) (DCGM_FI_DEV_FB_USED))",
              "instant": true,
              "refId": "A",
              "hide": false,
              "datasource": "${DS_PROMETHEUS}"
            }
          ],
          "transformations": []
        },
        {
          "id": 9,
          "title": "Total GPUs (Non-Sliced)",
          "description": "Non-MIG GPU devices represented in exporter telemetry, allocated and unallocated. Physical MIG parent cards are excluded.",
          "type": "stat",
          "pluginVersion": "13.0.1",
          "datasource": "${DS_PROMETHEUS}",
          "gridPos": {
            "x": 5,
            "y": 0,
            "w": 4,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "purple",
                "mode": "fixed"
              },
              "decimals": 0,
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
