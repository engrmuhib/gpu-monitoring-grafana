              "title": "See allocation by server",
              "url": "/d/gpu-fleet-summary?viewPanel=17&from=${__from}&to=${__to}"
            }
          ],
          "targets": [
            {
              "expr": "count(count by (Hostname, UUID) (DCGM_FI_DEV_FB_USED{GPU_I_PROFILE=\"\"})) or (count(count by (Hostname, UUID, GPU_I_ID) (DCGM_FI_DEV_FB_USED)) * 0)",
              "instant": true,
              "range": false,
              "refId": "A",
              "hide": false,
              "datasource": "${DS_PROMETHEUS}"
            }
          ],
          "transformations": []
        },
