fig=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\"))",
              "format": "table",
              "instant": true
            },
            {
              "refId": "C",
              "expr": "((sum by ($ns_label, $pod_label, Hostname, GPU_I_PROFILE) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\", $ns_label=~\"$namespace\", $pod_label!=\"\"}) * 1024 * 1024) * on (Hostname) group_left(label_nvidia_com_mig_config) label_replace(kube_node_labels{node=~\"$node\", label_nvidia_com_mig_config=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\")) or ((sum by ($ns_label, $pod_label, Hostname, GPU_I_PROFILE) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\", $ns_label=~\"$namespace\", $pod_label!=\"\"}) * 1024 * 1024) unless on (Hostname) label_replace(kube_node_labels{node=~\"$node\", label_nvidia_com_mig_config=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\"))",
              "format": "table",
              "instant": true
            },
            {
              "refId": "D",
              "expr": "((avg by ($ns_label, $pod_label, Hostname, GPU_I_PROFILE) (DCGM_FI_PROF_PIPE_TENSOR_ACTIVE{Hostname=~\"$node\", $ns_label=~\"$namespace\", $pod_label!=\"\"})) * on (Hostname) group_left(label_nvidia_com_mig_config) label_replace(kube_node_labels{node=~\"$node\", label_nvidia_com_mig_config=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\")) or ((avg by ($ns_label, $pod_label, Hostname, GPU_I_PROFILE) (DCGM_FI_PROF_PIPE_TENSOR_ACTIVE{Hostname=~\"$node\", $ns_label=~\"$namespace\", $pod_label!=\"\"})) unless on (Hostname) label_replace(kube_node_labels{node=~\"$node\", label_nvidia_com_mig_config=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\"))",
              "format": "table",
              "instant": true
            }
