        {
          "id": 31,
          "type": "stat",
          "title": "GPU-equivalent-hours wasted (selected range)",
          "description": "Weighted idle capacity, allocated but not earning its keep, converted into true GPU-hours over the dashboard's current time range. This is the closest thing to a cost figure this build produces without real pricing input: widen the time picker to 30d and this reads as a monthly waste number in actual GPU terms, not raw device counts.",
