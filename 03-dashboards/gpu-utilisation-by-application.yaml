        {
          "id": 30,
          "type": "stat",
          "title": "Fleet-equivalent headroom",
          "description": "Physical GPUs minus GPU-equivalents in use: true spare whole-GPU capacity available right now, accounting for MIG efficiency. The number to check before telling management whether a new workload needs new hardware or just needs a slice of what's already there.",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 32
          },
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "(count(count by (UUID) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}))) - (sum (\n  DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"1g.*\"} * 1/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"2g.*\"} * 2/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"3g.*\"} * 3/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"4g.*\"} * 4/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"7g.*\"} * 7/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=\"\"}\n))",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "blue",
                "mode": "fixed"
