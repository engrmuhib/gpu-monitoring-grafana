apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: gpu-utilisation-by-application
  namespace: gpu-monitoring
spec:
  allowCrossNamespaceImport: false
  resyncPeriod: 5m
  instanceSelector:
    matchLabels:
      dashboards: gpu-grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Thanos
  json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Thanos",
          "type": "datasource",
          "pluginId": "prometheus"
        }
      ],
      "title": "GPU Utilisation by Application (MIG-aware)",
      "uid": "gpu-by-app",
      "tags": [
        "gpu",
        "dcgm",
        "nvidia",
        "mig",
        "weighted"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "editable": true,
      "time": {
        "from": "2026-09-07T07:10:59.000Z",
        "to": "2026-09-07T07:23:58.000Z"
      },
      "templating": {
        "list": [
          {
            "name": "ns_label",
            "label": "Namespace label",
            "current": {
              "text": "exported_namespace",
              "value": "exported_namespace"
            },
            "hide": 0,
            "type": "custom",
            "query": "exported_namespace,namespace",
            "options": [
              {
                "text": "exported_namespace",
                "value": "exported_namespace",
                "selected": true
              },
              {
                "text": "namespace",
                "value": "namespace",
                "selected": false
              }
            ]
          },
          {
            "name": "pod_label",
            "label": "Pod label",
            "current": {
              "text": "exported_pod",
              "value": "exported_pod"
            },
            "hide": 0,
            "type": "custom",
            "query": "exported_pod,pod",
            "options": [
              {
                "text": "exported_pod",
                "value": "exported_pod",
                "selected": true
              },
              {
                "text": "pod",
                "value": "pod",
                "selected": false
              }
            ]
          },
          {
            "name": "node",
            "label": "GPU node",
            "current": {
              "text": "All",
              "value": [
                "$__all"
              ]
            },
            "hide": 0,
            "type": "query",
            "datasource": "${DS_PROMETHEUS}",
            "query": "label_values(DCGM_FI_DEV_FB_USED, Hostname)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*"
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "type": "query",
            "datasource": "${DS_PROMETHEUS}",
            "query": "label_values(DCGM_FI_DEV_FB_USED, $ns_label)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "GPU-equivalents in use",
          "description": "MIG slice activity weighted to whole GPUs by compute slices out of 7: a 1g instance at 100% counts as 0.14 GPUs, a 3g instance as 0.43, a 7g instance or a non-MIG GPU as 1.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "sum (\n  DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"1g.*\"} * 1/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"2g.*\"} * 2/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"3g.*\"} * 3/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"4g.*\"} * 4/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"7g.*\"} * 7/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=\"\"}\n)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Fleet utilisation",
          "description": "Weighted GPU-equivalents divided by physical GPU count.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "(\nsum (\n  DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"1g.*\"} * 1/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"2g.*\"} * 2/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"3g.*\"} * 3/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"4g.*\"} * 4/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=~\"7g.*\"} * 7/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE=\"\"}\n)\n)\n/\ncount(count by (UUID) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}))",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 0.4
                  },
                  {
                    "color": "orange",
                    "value": 0.85
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Physical GPUs",
          "description": "Counted by distinct UUID so MIG instances are not double counted.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "count(count by (UUID) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}))",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "text",
                "mode": "fixed"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "MIG slices allocated",
          "description": "Slices carrying a pod label. Compare against total slices to see spare partition capacity.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "count(DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $pod_label!=\"\"}) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "purple",
                "mode": "fixed"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "GPU memory in use",
          "description": "DCGM reports framebuffer in MiB. If FB_USED turns out to be device-level rather than per instance, wrap it in avg by (UUID) first.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "sum(DCGM_FI_DEV_FB_USED{Hostname=~\"$node\", $ns_label=~\"$namespace\"}) * 1024 * 1024",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "purple",
                "mode": "fixed"
              },
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Power draw",
          "description": "De-duplicated by UUID: power is a device metric repeated on every MIG series.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "sum(avg by (UUID) (DCGM_FI_DEV_POWER_USAGE{Hostname=~\"$node\"}))",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "yellow",
                "mode": "fixed"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "watt"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "GPU-equivalents consumed by namespace",
          "description": "Stacked, so the top of the stack is total fleet consumption in whole-GPU terms.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "sum by ($ns_label) (\n  DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $ns_label=~\"$namespace\", GPU_I_PROFILE=~\"1g.*\"} * 1/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $ns_label=~\"$namespace\", GPU_I_PROFILE=~\"2g.*\"} * 2/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $ns_label=~\"$namespace\", GPU_I_PROFILE=~\"3g.*\"} * 3/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $ns_label=~\"$namespace\", GPU_I_PROFILE=~\"4g.*\"} * 4/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $ns_label=~\"$namespace\", GPU_I_PROFILE=~\"7g.*\"} * 7/7\n  or DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $ns_label=~\"$namespace\", GPU_I_PROFILE=\"\"}\n)",
              "instant": false,
              "legendFormat": "{{namespace}}{{exported_namespace}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "showValues": false,
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "decimals": 2,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "annotations": {
              "clustering": -1,
              "multiLane": false
            },
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "GPU memory used by applications",
          "description": "",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "sum by ($ns_label, $pod_label) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\", $ns_label=~\"$namespace\"}) * 1024 * 1024",
              "instant": false,
              "legendFormat": "{{namespace}}{{exported_namespace}}/{{pod}}{{exported_pod}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 12,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "showValues": false,
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "annotations": {
              "clustering": -1,
              "multiLane": false
            },
            "legend": {
              "calcs": [
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Tensor core activity by workload",
          "description": "Raw slice-relative ratio, not weighted. High engine activity with low tensor activity means the GPU is busy but not doing useful matmul work.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "avg by ($ns_label, $pod_label) (DCGM_FI_PROF_PIPE_TENSOR_ACTIVE{Hostname=~\"$node\", $ns_label=~\"$namespace\"})",
              "instant": false,
              "legendFormat": "{{pod}}{{exported_pod}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 12,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "showValues": false,
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "annotations": {
              "clustering": -1,
              "multiLane": false
            },
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Power draw by node",
          "description": "",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (Hostname) (avg by (UUID, Hostname) (DCGM_FI_DEV_POWER_USAGE{Hostname=~\"$node\"}))",
              "instant": false,
              "legendFormat": "{{Hostname}}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "barWidthFactor": 0.6,
                "drawStyle": "line",
                "fillOpacity": 12,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "showValues": false,
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "watt"
            },
            "overrides": []
          },
          "options": {
            "annotations": {
              "clustering": -1,
              "multiLane": false
            },
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "hideZeros": false,
