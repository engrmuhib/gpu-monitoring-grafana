        {
          "id": 33,
          "type": "table",
          "title": "Memory in use (percent) by application",
          "description": "Each application's memory usage shown two ways: as a share of its own device/slice's capacity, and as a share of the whole fleet's total memory. The first answers “is this application's own GPU nearly full”, the second answers “how much of the entire fleet does this application account for”, a small percentage under either heading means different things depending on which one you're reading.",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 43
          },
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "avg by ($ns_label, $pod_label, Hostname, GPU_I_PROFILE) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\", $ns_label=~\"$namespace\", $pod_label!=\"\"} / (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\", $ns_label=~\"$namespace\", $pod_label!=\"\"} + DCGM_FI_DEV_FB_FREE{Hostname=~\"$node\", $ns_label=~\"$namespace\", $pod_label!=\"\"}))",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "expr": "sum by ($ns_label, $pod_label, Hostname, GPU_I_PROFILE) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\", $ns_label=~\"$namespace\", $pod_label!=\"\"}) / scalar(sum(DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"} + DCGM_FI_DEV_FB_FREE{Hostname=~\"$node\"}))",
              "format": "table",
