              "expr": "sum (\n  (1/7) * (1 - avg_over_time(DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $pod_label!=\"\", GPU_I_PROFILE=~\"1g.*\"}[$__range]))\n  or (2/7) * (1 - avg_over_time(DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $pod_label!=\"\", GPU_I_PROFILE=~\"2g.*\"}[$__range]))\n  or (3/7) * (1 - avg_over_time(DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $pod_label!=\"\", GPU_I_PROFILE=~\"3g.*\"}[$__range]))\n  or (4/7) * (1 - avg_over_time(DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $pod_label!=\"\", GPU_I_PROFILE=~\"4g.*\"}[$__range]))\n  or (7/7) * (1 - avg_over_time(DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $pod_label!=\"\", GPU_I_PROFILE=~\"7g.*\"}[$__range]))\n  or (1 - avg_over_time(DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $pod_label!=\"\", GPU_I_PROFILE=\"\"}[$__range]))\n) * ($__range_s/3600)",
              "instant": true
