apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: gpu-xid-errors
  namespace: gpu-monitoring
spec:
  allowCrossNamespaceImport: false
  resyncPeriod: 5m
  instanceSelector:
    matchLabels:
      dashboards: gpu-grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Thanos
  json: |
    {
      "id": null,
      "uid": "gpu-xid-errors",
      "title": "GPU XID Errors",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "tags": [
        "gpu",
        "errors"
      ],
      "timezone": "browser",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "refresh": "1m",
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ],
        "hidden": false
      },
      "graphTooltip": 0,
      "links": [],
      "templating": {
        "list": []
      },
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Thanos",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "annotations": {
        "list": [
          {
            "builtIn": true,
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "type": "dashboard"
          },
          {
            "builtIn": true,
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "type": "dashboard"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "GPUs reporting nonzero XID codes",
          "type": "table",
          "datasource": "${DS_PROMETHEUS}",
          "description": "Only physical GPUs whose latest exported XID code is nonzero. Values are error codes, not event totals. No rows are expected if no GPU reports a nonzero code; absent telemetry can also produce no rows.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 16
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (Hostname, UUID) (increase(gpu_xid_events_total[$__range]))",
              "instant": true,
              "range": false,
              "format": "table",
              "datasource": "${DS_PROMETHEUS}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Hostname": "Server",
                  "UUID": "Physical GPU UUID",
                  "Value": "XID code"
                }
              }
            }
          ],
          "links": [
            {
              "title": "Back to GPU Fleet Summary",
              "url": "/d/gpu-fleet-summary?from=${__from}&to=${__to}",
              "targetBlank": false
            }
          ]
        }
      ]
    }
