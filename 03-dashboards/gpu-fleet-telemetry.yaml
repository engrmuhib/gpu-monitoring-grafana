          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "((count by (Hostname) (count by (Hostname, UUID) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}))) unless on (Hostname) ((((count by (Hostname) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE!=\"\"}))\nor (count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0)) > 0))) or ((count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0) and on (Hostname) ((((count by (Hostname) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE!=\"\"}))\nor (count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0)) > 0)))",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "expr": "(((count by (Hostname) (count by (Hostname, UUID) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", exported_pod!=\"\"})))\nor (count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0)) unless on (Hostname) ((((count by (Hostname) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE!=\"\"}))\nor (count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0)) > 0))) or ((count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0) and on (Hostname) ((((count by (Hostname) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE!=\"\"}))\nor (count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0)) > 0)))",
              "format": "table",
              "instant": true
            },
            {
              "refId": "C",
              "expr": "(((count by (Hostname) (count by (Hostname, UUID) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}))) unless on (Hostname) ((((count by (Hostname) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE!=\"\"}))\nor (count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0)) > 0))) or ((count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0) and on (Hostname) ((((count by (Hostname) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE!=\"\"}))\nor (count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0)) > 0)))) - ((((count by (Hostname) (count by (Hostname, UUID) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", exported_pod!=\"\"})))\nor (count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0)) unless on (Hostname) ((((count by (Hostname) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE!=\"\"}))\nor (count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0)) > 0))) or ((count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0) and on (Hostname) ((((count by (Hostname) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE!=\"\"}))\nor (count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0)) > 0))))",
              "format": "table",
              "instant": true
            },
            {
              "refId": "D",
              "expr": "(count by (Hostname) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE!=\"\"}))\nor (count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0)",
              "format": "table",
              "instant": true
