        {
          "id": 22,
          "type": "table",
          "title": "Advertised vs physical",
          "description": "Physical is counted by distinct UUID via DCGM. Advertised comes from kube_node_status_allocatable, relabeled from its own node label to Hostname so the two targets actually join into one row per node instead of sitting side by side unmatched. A gap here is expected on MIG-enabled nodes: they advertise nvidia.com/mig-<profile> resources instead of nvidia.com/gpu, so Advertised only reflects fully MIG-disabled nodes unless you add those resource names too. MIG strategy is the literal nvidia.com/mig.config value, same query as MIG configuration by node, depends on kube-state-metrics allowlisting that node label, verify with a live query before relying on this column if it comes back blank.",
          "gridPos": {
