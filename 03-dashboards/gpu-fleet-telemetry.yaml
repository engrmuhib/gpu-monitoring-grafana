              "refId": "A",
              "expr": "max by (Hostname, GPU_I_ID, UUID, err_code, err_msg, label_nvidia_com_mig_config, exported_namespace, exported_pod) (\n  ((((DCGM_FI_DEV_XID_ERRORS{Hostname=~\"$node\"} != 0) * on (Hostname) group_left(label_nvidia_com_mig_config) label_replace(kube_node_labels{node=~\"$node\", label_nvidia_com_mig_config=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\")) or ((DCGM_FI_DEV_XID_ERRORS{Hostname=~\"$node\"} != 0) unless on (Hostname) label_replace(kube_node_labels{node=~\"$node\", label_nvidia_com_mig_config=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\"))) * on (UUID) group_left(exported_namespace, exported_pod) DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $pod_label!=\"\"}) or ((((DCGM_FI_DEV_XID_ERRORS{Hostname=~\"$node\"} != 0) * on (Hostname) group_left(label_nvidia_com_mig_config) label_replace(kube_node_labels{node=~\"$node\", label_nvidia_com_mig_config=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\")) or ((DCGM_FI_DEV_XID_ERRORS{Hostname=~\"$node\"} != 0) unless on (Hostname) label_replace(kube_node_labels{node=~\"$node\", label_nvidia_com_mig_config=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\"))) unless on (UUID) DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $pod_label!=\"\"})\n)",
              "format": "table",
              "instant": true
