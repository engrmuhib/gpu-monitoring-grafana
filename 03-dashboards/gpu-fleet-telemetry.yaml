          "description": "err_code/err_msg are DCGM's own description of the fault, more useful than the raw XID number alone. This shows current nonzero readings only, not an event log, and DCGM's last-seen value doesn't self-clear: cross-check against XID transitions in the stats row above before treating an entry here as an active, ongoing fault rather than a historical one. Now also shows GPU number, the MIG strategy enabled on that node, and which application (if any) is currently holding the faulting device, a faulting GPU that isn't currently allocated to anything will still show up here, just with a blank application, rather than being silently dropped.",
          "gridPos": {
