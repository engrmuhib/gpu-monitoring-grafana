        {
          "id": 29,
          "type": "table",
          "title": "Node capacity: free vs used",
          "description": "One row per node. Each node's capacity counts in exactly one place, never both: MIG-disabled nodes report real numbers under Total/Used/Free GPUs and 0/0/0 under the MIG-slice columns, MIG-enabled nodes report the reverse, 0/0/0 under GPUs and real numbers under MIG slices. A whole physical card isn't a meaningful allocatable unit once it's partitioned, so it doesn't get counted there. Total GPUs + Total MIG slices, summed across every row, equals the fleet's Total devices figure exactly.",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 84
