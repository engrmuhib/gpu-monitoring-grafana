apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: gpu-fleet-telemetry
  namespace: gpu-monitoring
spec:
  allowCrossNamespaceImport: false
  resyncPeriod: 5m
  instanceSelector:
    matchLabels:
      dashboards: gpu-grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Thanos
  json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Thanos",
          "type": "datasource",
          "pluginId": "prometheus"
        }
      ],
      "title": "GPU Fleet Telemetry",
      "uid": "gpu-fleet-telemetry",
      "tags": [
        "gpu",
        "dcgm",
        "nvidia",
        "mig"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "editable": true,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "ns_label",
            "label": "Namespace label",
            "current": {
              "text": "exported_namespace",
              "value": "exported_namespace"
            },
            "hide": 0,
            "description": "Flip this if Prometheus keeps the raw DCGM label names instead of prefixing them.",
            "type": "custom",
            "query": "exported_namespace,namespace",
            "options": [
              {
                "text": "exported_namespace",
                "value": "exported_namespace",
                "selected": true
              },
              {
                "text": "namespace",
                "value": "namespace",
                "selected": false
              }
            ]
          },
          {
            "name": "pod_label",
            "label": "Pod label",
            "current": {
              "text": "exported_pod",
              "value": "exported_pod"
            },
            "hide": 0,
            "type": "custom",
            "query": "exported_pod,pod",
            "options": [
              {
                "text": "exported_pod",
                "value": "exported_pod",
                "selected": true
              },
              {
                "text": "pod",
                "value": "pod",
                "selected": false
              }
            ]
          },
          {
            "name": "node",
            "label": "GPU node",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "type": "query",
            "datasource": "${DS_PROMETHEUS}",
            "query": "label_values(DCGM_FI_DEV_FB_USED, Hostname)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*"
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "type": "query",
            "datasource": "${DS_PROMETHEUS}",
            "query": "label_values(DCGM_FI_DEV_FB_USED, $ns_label)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Total devices",
          "description": "Independently addressable DCGM devices, physical cards and MIG instances alike, each counted separately. A card with MIG disabled counts as 1; a card split into N MIG instances counts as N. Click through to Fleet baseboard for the row-by-row breakdown. Capacity funnel stage 1 of 4.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "datasource": "${DS_PROMETHEUS}",
          "links": [
            {
              "targetBlank": false,
              "title": "See the per-device rows behind this number",
              "url": "/d/gpu-fleet-telemetry?viewPanel=6&${__all_variables}&from=${__from}&to=${__to}"
            }
          ],
          "targets": [
            {
              "refId": "A",
              "expr": "count(DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "text",
                "mode": "fixed"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Allocated",
          "description": "Devices (cards or MIG instances) carrying a pod label in DCGM. Deliberately not kube_pod_container_resource_requests: that metric only counts the nvidia_com_gpu resource, which MIG-slice requests (nvidia.com/mig-<profile>) don't use, so on a MIG-partitioned fleet it silently undercounts. This is the same source the fleet baseboard uses, so the two never disagree.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "datasource": "${DS_PROMETHEUS}",
          "links": [
            {
              "targetBlank": false,
              "title": "See which workload is holding these devices",
              "url": "/d/gpu-fleet-telemetry?viewPanel=20&${__all_variables}&from=${__from}&to=${__to}"
            }
          ],
          "targets": [
            {
              "refId": "A",
              "expr": "count(DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", $pod_label!=\"\"}) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "fixedColor": "purple",
                "mode": "fixed"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Active",
          "description": "Devices with engine activity above 0.05. Unweighted: a 1g slice and a full GPU both count as one.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "datasource": "${DS_PROMETHEUS}",
          "links": [
            {
              "targetBlank": false,
              "title": "See the per-device rows behind this number",
              "url": "/d/gpu-fleet-telemetry?viewPanel=6&${__all_variables}&from=${__from}&to=${__to}"
            }
          ],
          "targets": [
            {
              "refId": "A",
              "expr": "count(DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\"} > 0.05) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Effective",
          "description": "Devices with tensor-core activity above 0.20. High engine activity with low tensor activity means busy but not doing matmul work.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "datasource": "${DS_PROMETHEUS}",
          "links": [
            {
              "targetBlank": false,
              "title": "See the per-device rows behind this number",
              "url": "/d/gpu-fleet-telemetry?viewPanel=6&${__all_variables}&from=${__from}&to=${__to}"
            }
          ],
          "targets": [
            {
              "refId": "A",
              "expr": "count(DCGM_FI_PROF_PIPE_TENSOR_ACTIVE{Hostname=~\"$node\"} > 0.20) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "XID alerts",
          "description": "Devices with a currently nonzero last-seen XID. DCGM doesn't clear this on its own, a device that faulted once and never reset can sit here indefinitely, so nonzero doesn't always mean actively faulting right now. Cross-check against XID transitions (right) before treating this as urgent.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "datasource": "${DS_PROMETHEUS}",
          "links": [
            {
              "targetBlank": false,
              "title": "See which device is alerting",
              "url": "/d/gpu-fleet-telemetry?viewPanel=6&${__all_variables}&from=${__from}&to=${__to}"
            }
          ],
          "targets": [
            {
              "refId": "A",
              "expr": "count(DCGM_FI_DEV_XID_ERRORS{Hostname=~\"$node\"} != 0) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "XID transitions",
          "description": "Devices whose XID code actually changed within the current time range, via changes(...). This is the stronger signal: nonzero here means something happened recently, not just that DCGM is still remembering an old fault.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "datasource": "${DS_PROMETHEUS}",
          "links": [
            {
              "targetBlank": false,
              "title": "See which device changed state",
              "url": "/d/gpu-fleet-telemetry?viewPanel=6&${__all_variables}&from=${__from}&to=${__to}"
            }
          ],
          "targets": [
            {
              "refId": "A",
              "expr": "count(changes(DCGM_FI_DEV_XID_ERRORS{Hostname=~\"$node\"}[$__range]) > 0) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          }
        },
        {
          "id": 6,
          "type": "table",
          "title": "Fleet baseboard",
          "description": "One row per physical device or MIG instance. GPU is the physical card index (0-7); MIG instance distinguishes multiple slices of the same profile on the same card. Namespace/Application show which workload currently holds that device, blank means it's free. DCGM attaches these labels to the same activity metric this table already queries, no extra join needed.",
          "gridPos": {
            "h": 11,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "((avg by (Hostname, gpu, GPU_I_ID, GPU_I_PROFILE, exported_namespace, exported_pod) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\"})) * on (Hostname) group_left(label_nvidia_com_mig_config) label_replace(kube_node_labels{node=~\"$node\", label_nvidia_com_mig_config=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\")) or ((avg by (Hostname, gpu, GPU_I_ID, GPU_I_PROFILE, exported_namespace, exported_pod) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\"})) unless on (Hostname) label_replace(kube_node_labels{node=~\"$node\", label_nvidia_com_mig_config=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\"))",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "expr": "((avg by (Hostname, gpu, GPU_I_ID, GPU_I_PROFILE, exported_namespace, exported_pod) (DCGM_FI_PROF_PIPE_TENSOR_ACTIVE{Hostname=~\"$node\"})) * on (Hostname) group_left(label_nvidia_com_mig_config) label_replace(kube_node_labels{node=~\"$node\", label_nvidia_com_mig_config=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\")) or ((avg by (Hostname, gpu, GPU_I_ID, GPU_I_PROFILE, exported_namespace, exported_pod) (DCGM_FI_PROF_PIPE_TENSOR_ACTIVE{Hostname=~\"$node\"})) unless on (Hostname) label_replace(kube_node_labels{node=~\"$node\", label_nvidia_com_mig_config=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\"))",
              "format": "table",
              "instant": true
            },
            {
              "refId": "C",
              "expr": "((avg by (Hostname, gpu, GPU_I_ID, GPU_I_PROFILE, exported_namespace, exported_pod) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) / avg by (Hostname, gpu, GPU_I_ID, GPU_I_PROFILE, exported_namespace, exported_pod) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"} + DCGM_FI_DEV_FB_FREE{Hostname=~\"$node\"})) * on (Hostname) group_left(label_nvidia_com_mig_config) label_replace(kube_node_labels{node=~\"$node\", label_nvidia_com_mig_config=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\")) or ((avg by (Hostname, gpu, GPU_I_ID, GPU_I_PROFILE, exported_namespace, exported_pod) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) / avg by (Hostname, gpu, GPU_I_ID, GPU_I_PROFILE, exported_namespace, exported_pod) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"} + DCGM_FI_DEV_FB_FREE{Hostname=~\"$node\"})) unless on (Hostname) label_replace(kube_node_labels{node=~\"$node\", label_nvidia_com_mig_config=~\".+\"}, \"Hostname\", \"$1\", \"node\", \"(.*)\"))",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true
                },
                "renameByName": {
                  "GPU_I_ID": "MIG instance",
                  "GPU_I_PROFILE": "MIG profile",
                  "Hostname": "Node",
                  "Value #A": "Activity",
                  "Value #B": "Tensor",
                  "Value #C": "Memory",
                  "exported_namespace": "Namespace",
                  "exported_pod": "Application",
                  "gpu": "GPU",
                  "label_nvidia_com_mig_config": "MIG strategy"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "Node"
                  },
                  {
                    "field": "GPU"
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false,
                "minWidth": 90
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Activity"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "max",
                    "value": 1
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "mode": "gradient",
                      "type": "gauge"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Tensor"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "max",
                    "value": 1
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "mode": "gradient",
                      "type": "gauge"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Memory"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "max",
                    "value": 1
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "mode": "gradient",
                      "type": "gauge"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "MIG profile"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1g.16gb": {
                            "text": "1g.18gb",
                            "index": 0
                          },
                          "2g.33gb": {
                            "text": "2g.35gb",
                            "index": 1
                          },
                          "3g.70gb": {
                            "text": "3g.71gb",
                            "index": 2
                          },
                          "7g.140gb": {
                            "text": "7g.141gb",
                            "index": 3
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "cellHeight": "sm",
            "showHeader": true
          }
        },
        {
          "id": 10,
          "type": "table",
          "title": "Activity by node",
          "description": "Average and maximum engine activity per node, across every device or MIG instance on that node.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "datasource": "${DS_PROMETHEUS}",
          "targets": [
            {
              "refId": "A",
              "expr": "avg by (Hostname) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\"})",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "expr": "max by (Hostname) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\"})",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time 1": true,
                  "Time 2": true
                },
                "renameByName": {
                  "Hostname": "Node",
                  "Value #A": "Avg",
                  "Value #B": "Max"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "desc": true,
                    "field": "Avg"
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false,
                "minWidth": 90
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Avg"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Max"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
