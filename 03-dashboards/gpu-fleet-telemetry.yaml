          "description": "MIG strategy (node label) is the literal nvidia.com/mig.config value, straight from Kubernetes, when kube-state-metrics is configured to expose it, verify with a live query before relying on this column, see the runbook. The three count columns are derived from DCGM directly and always work regardless of that: a node with only the middle column nonzero is running a partitioned (e.g. all-balanced) profile, only the last column nonzero means MIG is off fleet-wide on that node, and only the first column nonzero means every card is configured as a single whole-GPU MIG instance (e.g. all-7g.141gb).",
