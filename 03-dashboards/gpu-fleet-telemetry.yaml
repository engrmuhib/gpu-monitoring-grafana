            {
              "refId": "E",
              "expr": "(count by (Hostname) (DCGM_FI_PROF_GR_ENGINE_ACTIVE{Hostname=~\"$node\", GPU_I_PROFILE!=\"\", exported_pod!=\"\"}))\nor (count by (Hostname) (DCGM_FI_DEV_FB_USED{Hostname=~\"$node\"}) * 0)",
