                  "UUID": "UUID",
                  "err_code": "XID",
                  "err_msg": "Message",
                  "exported_namespace": "Application (namespace)",
                  "exported_pod": "Application (pod)",
                  "label_nvidia_com_mig_config": "MIG strategy"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "cellOptions": {
                  "type": "auto"
                },
                "footer": {
                  "reducers": []
                },
                "inspect": false,
                "minWidth": 90
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "cellHeight": "sm",
            "showHeader": true
          }
